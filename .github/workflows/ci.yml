name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Agent build + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned CMake / clang tools and Ninja
        run: pip install -r tools/requirements.txt ninja==1.13.2
      - name: Configure (dev preset, warnings as errors)
        run: cmake --preset dev
        env:
          CXX: clang++
      - name: Build
        run: cmake --build --preset dev
      - name: Unit, replay and Sysmon-XML tests
        run: ctest --preset dev
      - name: Replay demo over every scenario
        run: |
          for f in ../samples/scenario_*.jsonl; do
            ./build/dev/edr-agent replay "$f" --stdout --rules-dir ../rules/detections \
              --scoring ../rules/scoring.yaml --baseline ../samples/baseline.json
          done
          ./build/dev/edr-agent rules check --rules-dir ../rules/detections --scoring ../rules/scoring.yaml
      - name: Keep the Linux binary for the parity tests
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edr-agent-linux
          path: agent/build/dev/edr-agent
          retention-days: 3

  agent-asan:
    name: Agent ASan + UBSan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt ninja==1.13.2
      - run: cmake --preset asan
        env:
          CXX: clang++
      - run: cmake --build --preset asan
      - run: ctest --preset asan

  agent-windows:
    name: Agent on Windows (MSVC, Sysmon + ETW collectors)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt ninja==1.13.2
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Configure with -DEDR_ENABLE_WINDOWS_COLLECTORS=ON
        run: cmake --preset windows-msvc
      - name: Build (MSVC /W4 /WX)
        run: cmake --build --preset windows-msvc
      - name: Unit tests
        run: ctest --preset windows-msvc
      - name: Replay demo
        shell: bash
        run: |
          ./build/windows-msvc/edr-agent.exe replay ../samples/scenario_2_phishing_chain.jsonl \
            --stdout --rules-dir ../rules/detections --scoring ../rules/scoring.yaml \
            --baseline ../samples/baseline.json

  lint-cpp:
    name: clang-format + clang-tidy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt ninja==1.13.2
      - run: cmake --preset dev
        env:
          CXX: clang++
      - name: Build (generates headers for clang-tidy's compile database)
        run: cmake --build --preset dev
      - run: ./tools/lint.sh

  server:
    name: Server (Python ${{ matrix.python }}, SQLite)
    needs: agent
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Fetch the C++ agent for the parity tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: edr-agent-linux
          path: ${{ runner.temp }}/agent
      - run: chmod +x "$RUNNER_TEMP/agent/edr-agent"
      - name: pytest (includes C++/Python scoring parity)
        run: pytest -q -ra
        env:
          EDR_AGENT_BIN: ${{ runner.temp }}/agent/edr-agent
      - name: Samples are up to date
        run: python ../samples/tools/generate_samples.py --check

  server-postgres:
    name: Server on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: edr_test
          POSTGRES_USER: edr
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edr -d edr_test" --health-interval 5s --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: server
    env:
      EDR_TEST_DATABASE_URL: postgresql+psycopg://edr:ci-only-password@127.0.0.1:5432/edr_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Alembic migration on PostgreSQL
        run: DATABASE_URL="$EDR_TEST_DATABASE_URL" python -m edr_server migrate
        env:
          PYTHONPATH: src
      - name: API tests on PostgreSQL
        run: pytest -q -ra tests/test_api.py

  dashboard:
    name: Dashboard lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: docker compose build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install PyYAML==6.0.3
      - name: Generate throwaway credentials for this run
        run: |
          token=$(python -c "import secrets; print(secrets.token_urlsafe(32))")
          echo "::add-mask::$token"
          hash=$(printf '%s' "$token" | sha256sum | cut -d' ' -f1)
          db_pw=$(python -c "import secrets; print(secrets.token_urlsafe(24))")
          echo "::add-mask::$db_pw"
          printf 'POSTGRES_PASSWORD=%s\nEDR_AGENT_TOKEN_HASHES=ci-agent:%s\n' "$db_pw" "$hash" > .env
          echo "EDR_AGENT_TOKEN=$token" >> "$GITHUB_ENV"
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test (healthz, ingest via forwarder, read API through nginx)
        run: python scripts/compose_smoke.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
