[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "edr-server"
dynamic = ["version"]
description = "Ingest, re-scoring and read API for the EDR Agent (monitor-only)."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "SQLAlchemy==2.1.6",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "alembic==1.20.0",
    "PyYAML==6.0.3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[tool.setuptools.dynamic]
version = { attr = "edr_server.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]
"migrations/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
# Starlette 1.10 prefers httpx2 for its TestClient; httpx 0.28.1 still works and is what we pin.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
