server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # Read API only: the dashboard never needs the agent ingest endpoints.
    location ~ ^/api/v1/(hosts|incidents|stats) {
        limit_except GET { deny all; }
        proxy_pass http://server:8000;
        proxy_set_header Host $host;
    }
    location = /healthz {
        proxy_pass http://server:8000;
    }
    location /api/ {
        return 404;
    }
    location / {
        try_files $uri /index.html;
    }
}
