# Local deployment: PostgreSQL + EDR server + dashboard. Every port is published on 127.0.0.1
# only. Copy .env.example to .env and fill in real values first (docker compose reads .env).
name: edr-agent

services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: edr
      POSTGRES_USER: edr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edr -d edr"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://edr:${POSTGRES_PASSWORD}@postgres:5432/edr
      EDR_AGENT_TOKEN_HASHES: ${EDR_AGENT_TOKEN_HASHES:?set EDR_AGENT_TOKEN_HASHES in .env}
      EDR_READ_TOKEN_HASH: ${EDR_READ_TOKEN_HASH:-}
      EDR_LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  dashboard:
    build:
      context: dashboard
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

volumes:
  pgdata:
